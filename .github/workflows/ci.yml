# SPDX-License-Identifier: GPL-3.0-or-later
name: Verify and release
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: windows-2022
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shell: [powershell, pwsh]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Parse scripts and run isolated contracts
        shell: ${{ matrix.shell }}
        run: |
          $ErrorActionPreference = 'Stop'
          Get-ChildItem -Recurse -File | Where-Object { $_.Extension -in '.ps1','.psm1','.psd1' } | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) { throw ($errors | Out-String) }
          }
          & ./tests/contracts.ps1
  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: windows-2022
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: publish-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Archive tested source and publish immutable package
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          function Check-Native { if ($LASTEXITCODE -ne 0) { throw "Native command failed ($LASTEXITCODE)." } }
          $manifest = Import-PowerShellDataFile ./PowerShellHAL.psd1
          $version = $manifest.ModuleVersion
          if ($version -notmatch '^[0-9]+\.[0-9]+\.[0-9]+$') { throw 'Invalid module version.' }
          $tag = "v$version"
          git fetch origin main --tags
          Check-Native
          if ((git rev-parse origin/main) -ne $env:GITHUB_SHA) { Write-Host 'Candidate superseded.'; exit 0 }
          $tagSha = git rev-parse -q --verify "refs/tags/$tag"
          if ($LASTEXITCODE -eq 0 -and $tagSha -ne $env:GITHUB_SHA) { Write-Host 'Version already published.'; exit 0 }
          $name = "PowerShellHAL-$version.zip"
          New-Item -ItemType Directory -Force release | Out-Null
          git archive --format=zip "--output=release/$name" $env:GITHUB_SHA
          Check-Native
          $hash = (Get-FileHash "release/$name" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $name" | Set-Content release/SHA256SUMS.txt -Encoding ascii -NoNewline
          $json = gh release view $tag --json isDraft,targetCommitish
          if ($LASTEXITCODE -eq 0) {
            $state = $json | ConvertFrom-Json
            $draft = $state.isDraft
            if ($draft -and $state.targetCommitish -ne $env:GITHUB_SHA) { throw 'Draft belongs to another commit.' }
          } else {
            gh release create $tag --target $env:GITHUB_SHA --draft --title "PowerShell HAL $version" --notes "Tested on Windows PowerShell 5.1 and PowerShell 7. Source commit: $env:GITHUB_SHA."
            Check-Native
            $draft = $true
          }
          if ($draft) { gh release upload $tag release/* --clobber; Check-Native }
          function Verify-Remote {
            $destination = Join-Path $env:RUNNER_TEMP ([Guid]::NewGuid().ToString())
            New-Item -ItemType Directory $destination | Out-Null
            gh release download $tag --dir $destination
            Check-Native
            $expected = @(Get-ChildItem release -File | Select-Object -ExpandProperty Name | Sort-Object)
            $actual = @(Get-ChildItem $destination -File | Select-Object -ExpandProperty Name | Sort-Object)
            if (Compare-Object $expected $actual) { throw 'Remote asset set differs.' }
            foreach ($asset in $expected) {
              if ((Get-FileHash "release/$asset").Hash -ne (Get-FileHash (Join-Path $destination $asset)).Hash) {
                throw "Remote asset bytes differ: $asset"
              }
            }
          }
          Verify-Remote
          if ($draft) { gh release edit $tag --draft=false --latest; Check-Native }
          Verify-Remote
          git fetch origin "refs/tags/${tag}:refs/tags/${tag}"
          Check-Native
          if ((git rev-parse "refs/tags/$tag^{commit}") -ne $env:GITHUB_SHA) { throw 'Published tag differs.' }
